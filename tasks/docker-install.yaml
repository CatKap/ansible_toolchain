- name: Debian | Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    update_cache: true
  when: ansible_os_family == "Debian"
  become: true

- name: Determine if system is Debian or Ubuntu
  ansible.builtin.set_fact:
    is_ubuntu: "{{ ansible_distribution == 'Ubuntu' }}"
    is_debian: "{{ ansible_distribution == 'Debian' }}"
    docker_distro: "{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }}"
    docker_codename: >-
      {%- if ansible_distribution == 'Ubuntu' -%}
        {%- if ansible_distribution_release in ['resolute', 'plucky', 'questing', 'oracular'] -%}
          noble
        {%- else -%}
          {{ ansible_distribution_release }}
        {%- endif -%}
      {%- elif ansible_distribution == 'Debian' -%}
        {%- if ansible_distribution_release in ['trixie', 'sid', 'forky'] -%}
          bookworm
        {%- else -%}
          {{ ansible_distribution_release }}
        {%- endif -%}
      {%- else -%}
        bookworm
      {%- endif -%}

- name: Show detected OS info
  ansible.builtin.debug:
    msg:
      - "Distribution: {{ ansible_distribution }}"
      - "Release: {{ ansible_distribution_release }}"
      - "Docker distro: {{ docker_distro }}"
      - "Docker codename: {{ docker_codename }}"


- name: Add Docker GPG key (correct way)
  shell: |
    curl -fsSL https://download.docker.com/linux/{{ docker_distro }}/gpg \
    | gpg --dearmor -o {{ item }}/keyrings/docker.gpg
  args:
    creates: "{{ item }}/keyrings/docker.gpg"
  become: true
  loop:
    - /usr/share
    - /etc/apt


- name: Add Docker repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ docker_distro }}
      Suites: {{ docker_codename }}
      Components: stable
      Architectures: {{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      Signed-By: /etc/apt/keyrings/docker.gpg
  become: true
  register: docker_repo

- name: Debian | Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    update_cache: true
  when: ansible_os_family == "Debian"
  become: true
  ignore_errors: true

- name: Debian | Install Docker
  apt:
    name:
      - docker.io
    update_cache: true
  when: ansible_os_family == "Debian"
  become: true
  ignore_errors: true

- name: RHEL | Install required packages
  yum:
    name:
      - yum-utils
      - device-mapper-persistent-data
      - lvm2
    state: present
  when: ansible_os_family == "RedHat"
  become: true

- name: RHEL | Add Docker repository
  yum_repository:
    name: docker
    description: Docker CE repo
    baseurl: https://download.docker.com/linux/centos/9/x86_64/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/centos/gpg
    enabled: true
  when: ansible_os_family == "RedHat"
  become: true

- name: RHEL | Install Docker
  yum:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
  when: ansible_os_family == "RedHat"
  become: true

- name: Ensure AppArmor is installed and running (Debian/Ubuntu)
  become: true
  apt:
    name:
      - apparmor
      - apparmor-utils
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Enable and start Docker service
  become: true
  service:
    name: docker
    state: started
    enabled: true
  when: ansible_os_family == "Debian"
