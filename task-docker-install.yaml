- name: Debian | Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    update_cache: yes
  when: ansible_os_family == "Debian"
  become: true

- name: Add Docker GPG key (correct way)
  shell: |
    curl -fsSL https://download.docker.com/linux/debian/gpg \
    | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/docker-archive-keyring.gpg
  become: true

- name: Add Docker repository
  apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
      https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    state: present
  when: ansible_os_family == "Debian"
  become: true

- name: Debian | Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    update_cache: yes
  when: ansible_os_family == "Debian"
  become: true
  ignore_errors: true

- name: Debian | Install Docker
  apt:
    name:
      - docker.io
    update_cache: yes
  when: ansible_os_family == "Debian"
  become: true
  ignore_errors: true

- name: RHEL | Install required packages
  yum:
    name:
      - yum-utils
      - device-mapper-persistent-data
      - lvm2
    state: present
  when: ansible_os_family == "RedHat"
  become: true

- name: RHEL | Add Docker repository
  yum_repository:
    name: docker
    description: Docker CE repo
    baseurl: https://download.docker.com/linux/centos/9/x86_64/stable
    gpgcheck: yes
    gpgkey: https://download.docker.com/linux/centos/gpg
    enabled: yes
  when: ansible_os_family == "RedHat"
  become: true

- name: RHEL | Install Docker
  yum:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
  when: ansible_os_family == "RedHat"
  become: true

- name: Ensure AppArmor is installed and running (Debian/Ubuntu)
  become: true
  apt:
    name:
      - apparmor
      - apparmor-utils
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Enable and start Docker service
  become: true
  service:
    name: docker
    state: started
    enabled: true
  when: ansible_os_family == "Debian"


- name: Mkdir for sites
  command: mkdir -p /etc/nginx/sites-enabled 
  become: true



